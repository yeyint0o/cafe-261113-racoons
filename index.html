<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>まちかどカフェ</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/footer.css">
</head>

<body>
  <!-- ===== A ヘッダー ここから ===== -->
  <header class="site-header">
    <h1 class="site-header__logo">まちかどカフェ</h1>
    <ul class="site-header__nav">
      <li><a class="site-header__link" href="#">メニュー</a></li>
      <li><a class="site-header__link" href="#">アクセス</a></li>
      <li><a class="site-header__link" href="#">お知らせ</a></li>
    </ul>
    <a class="site-header__button" href="#">予約する</a>
  </header>

  <!-- ===== A ヘッダー ここまで ===== -->

  <!-- ===== B メイン ここから ===== -->
  <main class="menu">
    <h2 class="menu__title">おすすめメニュー</h2>
    <ul class="menu__list">
      <li class="menu__item">
        <h3 class="menu__name">ブレンドコーヒー</h3>
        <p class="menu__text">毎朝お店で焙煎する、香りのいい一杯。</p>
        <p class="menu__price">¥450</p>
        <a class="menu__button" href="#">注文する</a>
      </li>
      <li class="menu__item">
        <h3 class="menu__name">カフェラテ</h3>
        <p class="menu__text">ミルクたっぷりの、やさしい味。</p>
        <p class="menu__price">¥520</p>
        <a class="menu__button" href="#">注文する</a>
      </li>
      <li class="menu__item">
        <h3 class="menu__name">チーズケーキ</h3>
        <p class="menu__text">しっとり濃厚な、店長の自信作。</p>
        <p class="menu__price">¥480</p>
        <a class="menu__button" href="#">注文する</a>
      </li>
    </ul>
  </main>

  <!-- ===== B メイン ここまで ===== -->

  <!-- ===== C フッター ここから ===== -->
  <section class="contact" id="contact">
    <h2 class="contact__title">お問い合わせ</h2>
    <form class="contact__form">
      <label class="contact__label" for="name">お名前</label>
      <input class="contact__input" type="text" id="name" name="name">
      <label class="contact__label" for="message">ご用件</label>
      <textarea class="contact__input" id="message" name="message" rows="4"></textarea>
      <button class="contact__button" type="submit">送信する</button>
    </form>
  </section>

  <footer class="site-footer">
    <p class="site-footer__name">まちかどカフェ</p>
    <ul class="site-footer__info">
      <li>営業時間　8:00〜20:00</li>
      <li>定休日　水曜日</li>
    </ul>
    <a class="site-footer__link" href="#">お問い合わせ</a>
    <p class="site-footer__copy">© 2026 まちかどカフェ</p>
  </footer>


  <!-- ===== C フッター ここまで ===== -->
</body>

</html>
